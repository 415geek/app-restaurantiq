# 附录 B · 概念 / 菜系分类体系（评审 Spec §4.1）。id 用于 report_model.input.cuisine 与 poi.sub_cuisine。
#
# 六个顶级类目（category）：chinese_regional · chinese_format · asian_other · bakery_dessert · beverage · western_other
# 每条记录都带下游参数（按业态、不按面积）：audience（需求人群）、fte_default（默认人手）、takeout_share（外带占比）、
# daypart_profile（营业时段）、search（三层竞品检索：Layer-1 关键词 + Places types + Layer-2 替代关键词）。
#
# 字段约定：
#   keywords  — 用户输入 / 店名的分类关键词（中 / 英 / 粤拼 / 西语）。最长优先，同长取文本中最先出现者。
#   mappings  — Overture / Google 类别 id → 子类型（engines/competitor.ts 规则层：命中即定子类型，是否中餐看 category）。
#               只放能唯一指向该子类型的类别（japanese_restaurant …）；bakery / cafe / barbecue_restaurant 这类多义类型
#               放在 search.types（检索层与 engines/cuisine-share.ts#conceptOfPoi 按「同类目独占」规则读取）。
#   other_chinese 是「中餐 · 其他」的显式选项，不是分类器的静默兜底（未命中 → 让用户确认）。
