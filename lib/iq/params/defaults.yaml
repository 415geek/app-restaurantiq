# 附录 A · 默认参数表（全部可校准）。加载: lib/iq/params/index.ts
huff:
  alpha: 1.0
  beta: { everyday: 2.0, regular: 1.5, destination: 1.1 }
  adjacent_weight: 0.5          # L2 竞品在分母中的权重
  default_speed_mph: 25         # 无等时圈时的车速
demand:
  s_cn: 0.55                    # 华人家庭餐饮支出中的中餐份额
  s_other: 0.08                 # 非华裔家庭中餐份额
  lunch_out_rate: 0.35          # 工作日外食率
  region_multiplier: 1.15       # SF MSA 相对全国 CEX 的餐饮支出系数
  workdays_per_month: 21
review_to_covers:
  k: 80                         # 每条 Google 新评论 ≈ 80 次覆盖（区间 40–150，用 POS 客户数据校准）
cluster_score:                  # walk10 内 L1+L2 数量 → 分
  bands: [[0, 0, 30], [1, 3, 60], [4, 8, 85], [9, 15, 60], [16, 999, 35]]
  coverage_adjust: 10           # 按 coverage_ratio 调节 ±
void_analysis:
  min_chinese_pop_drive10: 3000
  density_ratio_threshold: 0.5
  min_l2_count: 4
competitor_guard:
  min_metro_pois_for_zero_check: 10   # metro 内该子菜系 ≥ 10 家而 drive10 内 L1+L2 == 0 → 抓取异常
  min_food_pois_drive10: 15           # drive10 内餐饮 POI < 15 且人口 > 20,000 → 覆盖异常
  min_pop_for_poi_check: 20000
# 评审 Spec §4.1 单一结论源（P0-A）：固定成本刻度表——唯一来源。
# lib/iq/engines/finance.ts（360）与 lib/funnel/iq-finance-model.ts（标准版）都只读这里，
# 代码里不得再出现任何水电/保险/POS/营销/杂项/工资的字面量。
# 租金永远不估算：用户没填就按「不含租金」出结论（finance.rent_excluded）。
cost_scale:
  tiers:                          # 成本档位：时薪、非租金固定成本系数、判档用的家庭收入中位数下限
    hcol: { wage_usd_per_hour: 22, other_fixed_multiplier: 1.12, min_median_income: 110000 }
    mcol: { wage_usd_per_hour: 18, other_fixed_multiplier: 1.00, min_median_income: 70000 }
    lcol: { wage_usd_per_hour: 15, other_fixed_multiplier: 0.88, min_median_income: 0 }
  hcol_states: [CA, NY, WA, MA, HI, DC, NJ]   # 收入未知时按州兜底判 hcol，其余 mcol
  labor: { hours_per_fte_month: 173, load_factor: 1.18 }
  split: { utilities: 0.30, insurance: 0.12, pos: 0.08, marketing: 0.25 }   # 杂项 = 余数
  concepts:                       # 业态原型 → mcol 档的基准非租金固定成本（$/月）与默认人手（taxonomy fte_default 优先）
    bubble_tea:    { other_fixed_usd: 4500, headcount: 5 }
    coffee_bakery: { other_fixed_usd: 4800, headcount: 5 }
    qsr:           { other_fixed_usd: 6000, headcount: 8 }
    fast_casual:   { other_fixed_usd: 7200, headcount: 9 }
    pizza:         { other_fixed_usd: 6500, headcount: 9 }
    asian_casual:  { other_fixed_usd: 7800, headcount: 11 }
    casual_dining: { other_fixed_usd: 9000, headcount: 16 }
    fine_dining:   { other_fixed_usd: 14000, headcount: 25 }
finance:
  safety_multiplier: 1.28
  occupancy_cost_bands: [[0, 0.08, 90], [0.08, 0.10, 70], [0.10, 0.12, 50], [0.12, 1, 25]]
  days_open_per_month: 30
  cc_fees_pct: 0.025
  delivery_blended_pct: 0.07
score:
  weights: { demand_coverage: 25, audience_fit: 15, competitive_position: 20, access_traffic: 15, financial_viability: 15, occasion_delivery: 10 }
  coverage_bands: [[0, 0.6, 20], [0.6, 0.8, 45], [0.8, 1.0, 65], [1.0, 1.3, 85], [1.3, 99, 95]]
  audience_thresholds: { destination: 0.15, regular: 0.10, everyday: 0.05 }   # 主商圈中文家庭占比阈值
  quality_gap: { low_rating: 4.0, high_rating: 4.4, bonus: 10 }
  closure_penalty: { threshold: 0.20, penalty: 15 }
confidence_weights: { acs: 20, competitors: 25, traffic_proxy: 15, rent_comps: 15, daytime_pop: 10, transit: 5, dev_pipeline: 5, user_inputs: 5 }
# §4.5：唯一一套结论阈值。≥ go → 可做 GO；≥ conditional → 有条件可做；否则不建议。
# 网页版与 PDF 打印的规则文字都必须与这两个数字一致（lib/iq/conclusion/conclusion.ts 是唯一出口）。
verdict: { go: 70, conditional: 55 }
rent_comps:
  min_comps_for_premium: 3
data_budget:
  # 底层重构 §3.2: Layer 1 searches one alias per script (≤3) at each of the two
  # radii, because Text Search matches names per language — so the direct layer
  # alone can be 6 calls before Layer 2, the anchors and any §3.1 refinement.
  google_places_max_calls: 14     # §4.2 三层检索：直接竞品 0.5/1 英里 × 别名 + 替代 + 品牌锚点 + L3/L4 锚点
  # 底层重构 §3.1: 截断细分的独立预算。此前细分预算是「总上限 − 计划步数」，
  # 12 步计划在 14 的上限下只剩 2 次，而一次四象限细分需要 4 次——线上等于从未细分。
  google_places_max_refine_calls: 32
  google_places_cost_usd_per_call: 0.032
  distance_matrix_max_calls: 4    # 步行距离（Distance Matrix，每次 ≤ 25 个目的地）
  distance_matrix_cost_usd_per_element: 0.005
  report_cost_cap_usd: 0.50
  data_cost_cap_usd: 0.10
rings:
  walk10: { mode: walking, minutes: 10, fallback_radius_mi: 0.5 }
  drive5: { mode: driving, minutes: 5, fallback_radius_mi: 1.0 }
  drive10: { mode: driving, minutes: 10, fallback_radius_mi: 3.0 }
  drive15: { mode: driving, minutes: 15, fallback_radius_mi: 5.0 }
