name: Trigger 360° report

# (Re)generate 360° reports for paid report ids from GitHub's runners — handy
# when the operator cannot reach the site from their tooling.
#   - manual: workflow_dispatch with a single report_id
#   - queued: push a change to .github/report360-queue.txt (one UUID per line,
#     `#` comments allowed; append `force` after the id to regenerate)
# The endpoint only requires the row to be paid. The job polls until ready.

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: 'iq_location_reports.id (UUID)'
        required: true
        type: string
      force:
        description: 'Regenerate even if a 360° model already exists'
        required: false
        default: 'false'
        type: string
      base_url:
        description: 'Site base URL'
        required: false
        default: 'https://app.restaurantiq.ai'
        type: string
  push:
    paths:
      - '.github/report360-queue.txt'

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Kick + poll
        env:
          BASE_URL: ${{ inputs.base_url || 'https://app.restaurantiq.ai' }}
          ONE_ID: ${{ inputs.report_id }}
          ONE_FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          if [ -n "${ONE_ID:-}" ]; then
            printf '%s %s\n' "$ONE_ID" "$([ "${ONE_FORCE:-false}" = "true" ] && echo force || true)" > /tmp/queue.txt
          else
            grep -vE '^\s*(#|$)' .github/report360-queue.txt > /tmp/queue.txt || true
          fi
          if [ ! -s /tmp/queue.txt ]; then echo "queue empty"; exit 0; fi
          rc=0
          while read -r id flag; do
            URL="$BASE_URL/api/iq/report360/$id"
            [ "${flag:-}" = "force" ] && URL="$URL?force=1"
            echo "=== POST $URL"
            code=$(curl -s -o /tmp/kick.json -w '%{http_code}' -X POST "$URL")
            echo "HTTP $code $(cat /tmp/kick.json)"
            case "$code" in 200|202) ;; *) echo "kick failed for $id"; rc=1; continue ;; esac
            for i in $(seq 1 60); do
              body=$(curl -s "$BASE_URL/api/iq/report360/$id")
              echo "$body"
              if echo "$body" | grep -q '"ready":true'; then
                echo "READY $id"
                # Server PDF probe: the 360° PDF must come back as application/pdf (not a JSON error).
                pcode=$(curl -s -o /tmp/probe.pdf -w '%{http_code}' -m 150 "$BASE_URL/api/iq/report/$id/pdf?lang=zh")
                ptype=$(file -b /tmp/probe.pdf | cut -c1-40); psize=$(stat -c %s /tmp/probe.pdf)
                # `file` reads the first /Pages node (Skia nests 8 kids per node); count leaf pages instead.
                pages=$( (grep -a -o '/Type */Page[^s]' /tmp/probe.pdf || true) | wc -l)
                counts=$( (grep -a -o '/Count [0-9]*' /tmp/probe.pdf || true) | sort -t' ' -k2 -n | tail -1)
                echo "PDF page objects=$pages max /Count=${counts:-none}"
                # Embedded font families (poppler-utils ships on ubuntu-latest); the report expects NotoSerifSC / NotoSansSC / Inter.
                (command -v pdffonts >/dev/null || (sudo apt-get -qq update >/dev/null 2>&1 && sudo apt-get -qq install -y poppler-utils >/dev/null 2>&1) || true)
                if command -v pdffonts >/dev/null; then echo "PDF fonts:"; pdffonts /tmp/probe.pdf 2>/dev/null | awk 'NR>2{print $1}' | sed 's/^[A-Z]\{6\}+//' | sort | uniq -c | sort -rn | head -12; fi
                echo "PDF HTTP $pcode size=$psize pages=$pages type=$ptype"
                if [ "$pcode" != "200" ] || ! head -c 5 /tmp/probe.pdf | grep -q '%PDF'; then echo "PDF probe failed: $(head -c 300 /tmp/probe.pdf)"; rc=1; else mkdir -p /tmp/pdfs && cp /tmp/probe.pdf "/tmp/pdfs/$id.pdf"; fi
                break
              fi
              if echo "$body" | grep -q '"migration_needed":true'; then echo "migration needed"; rc=1; break; fi
              sleep 10
            done
          done < /tmp/queue.txt
          exit $rc
      - name: Upload probed PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report360-pdfs
          path: /tmp/pdfs/*.pdf
          if-no-files-found: ignore
          retention-days: 7
